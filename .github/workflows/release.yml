name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write # lets the job ask nuget.org for a short-lived key (Trusted Publishing)

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Sync project PackageVersion
        run: |
          sed -i -E "s|<PackageVersion>[^<]+</PackageVersion>|<PackageVersion>${{ steps.version.outputs.VERSION }}</PackageVersion>|" src/Console/PodcastMetadataGenerator.Console.csproj
          echo "Updated PackageVersion in csproj to ${{ steps.version.outputs.VERSION }}"

      - name: Restore dependencies
        run: dotnet restore PodcastMetadataGenerator.sln

      - name: Build Solution
        run: dotnet build PodcastMetadataGenerator.sln --configuration Release --no-restore

      # Packs OutroKit and PodcastMetadataGenerator, the app's original package, which now tells
      # people to move to OutroKit. See CONTRIBUTING.md for when to stop publishing the old one.
      - name: Create NuGet packages (Console tool)
        run: .github/scripts/pack-tool.sh ./artifacts "${{ steps.version.outputs.VERSION }}"

      # nuget.org Trusted Publishing: no stored API key. The policy on nuget.org names this
      # repository and this workflow file (release.yml), with no environment, and must cover both
      # package IDs. The key lasts an hour, so it is requested right before the push.
      - name: Get temporary NuGet API key
        id: login
        uses: NuGet/login@v1
        with:
          user: jamesmontemagno

      # OutroKit goes first: the old package points people at it, so it must exist.
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in OutroKit PodcastMetadataGenerator; do
            dotnet nuget push ./artifacts/$package.*.nupkg \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ steps.version.outputs.VERSION }}
          path: ./artifacts/*.nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
