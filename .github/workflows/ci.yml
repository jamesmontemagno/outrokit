name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel only superseded CI runs for the same PR or branch, not other workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/[Nn]u[Gg]et.[Cc]onfig', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore dependencies
        run: dotnet restore PodcastMetadataGenerator.sln

      - name: Build Solution
        run: dotnet build PodcastMetadataGenerator.sln --no-restore --configuration Release

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS Apple silicon
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel

    env:
      # Without an ffmpeg that can burn captions those tests fail here, where locally they are skipped.
      PMG_TEST_REQUIRE_FFMPEG: "1"

    steps:
      - uses: actions/checkout@v4

      # Hosted Windows puts RUNNER_TEMP on the temporary drive; set both paths before any NuGet use.
      - name: Use temporary drive for NuGet (Windows)
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          "NUGET_PACKAGES=$(Join-Path $env:RUNNER_TEMP 'nuget-packages')" >> $env:GITHUB_ENV
          "NUGET_HTTP_CACHE_PATH=$(Join-Path $env:RUNNER_TEMP 'nuget-http-cache')" >> $env:GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES || '~/.nuget/packages' }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/[Nn]u[Gg]et.[Cc]onfig', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      # Each install follows the guide in site/index.html, so a pass here also means the guide's
      # ffmpeg can burn captions on that system.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The guide uses winget, which installs the same gyan.dev full build as this package.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress

      # Two installs in the guide's order. The standard formula has no subtitles filter, which the
      # tests use to check that the app detects it; ffmpeg-full is the build that burns captions.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          brew install ffmpeg-full
          echo "PMG_TEST_FFMPEG_WITHOUT_CAPTIONS=$(brew --prefix ffmpeg)/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "ffmpeg on PATH after both installs: $(command -v ffmpeg || echo none)"

      - name: Test
        run: dotnet test PodcastMetadataGenerator.sln --configuration Release --verbosity normal

  pack:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/[Nn]u[Gg]et.[Cc]onfig', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      # Packs OutroKit and the PodcastMetadataGenerator compatibility package, and checks both.
      - name: Create NuGet packages (Console tool)
        run: .github/scripts/pack-tool.sh ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
